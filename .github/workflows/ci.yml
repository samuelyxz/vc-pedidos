name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes (Vitest)
        run: npm test

      - name: Typecheck (tsc --checkJs)
        run: npm run typecheck

      - name: Build de produção
        run: npm run build

      - name: Lint
        run: npm run lint
